{% set name = "xorg-xserver-xvfb" %}
{% set version = "21.1.24" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://gitlab.freedesktop.org/xorg/xserver/-/archive/xorg-server-{{ version }}/xserver-xorg-server-{{ version }}.tar.gz
  sha256: 5051b8a339b9497cb573b57871fa7311a2d55c39c3d1cecd051804bbfe9c18e2

build:
  number: 1
  skip: true  # [win]

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - meson
    - ninja-base
    - pkg-config
  host:
    - xorg-font-util 1.4.1
    - xorg-libxfont2 2.0.9
    - xorg-libxau {{ xorg_libxau }}
    - xorg-libxdmcp {{ xorg_libxdmcp }}
    - xorg-xorgproto {{ xorg_xorgproto }}
    - xorg-xtrans 1.6.0
    - xkeyboard-config 2.48
    - openssl {{ openssl }}
    - pixman {{ pixman }}
    - libxkbfile {{ libxkbfile }}
  run:
    - xorg-libxfont2
    - xkeyboard-config
    - xkbcomp

test:
  commands:
    - Xvfb -help
    # Xvfb test fails only on osx due to a genuine upstream xkeyboard-config
    # data conflict (duplicate symbols on <FK23>/<FK24> between the default
    # `evdev` keycodes and the newer `inet` multimedia-key bindings introduced
    # alongside xorgproto 2025.1 keysym support). The exact same warnings occur
    # on Linux, but Linux's Xvfb treats xkbcomp keymap-compile issues as
    # non-fatal and falls back, while macOS's Xvfb hard-fails to activate the virtual
    # core keyboard.
    # Similar confilct described here (kernel/
    # xkeyboard-config maintainers actively debating the FK23/FK24 remapping):
    # https://lkml.iu.edu/2503.2/01837.html
    # Disabling this test on osx until xkeyboard-config ships an upstream fix
    # for the FK23/FK24 conflict.
    - Xvfb :99 -screen 0 800x600x24 -nolisten tcp -noreset -fp built-ins & XVFB_PID=$! && sleep 2 && kill $XVFB_PID  # [not osx]
about:
  home: https://www.x.org/
  summary: Virtual framebuffer X server.
  description: |
    Xvfb is an X server that can run on machines with no display hardware and no
    physical input devices. It emulates a dumb framebuffer using virtual memory.
  license: MIT
  license_family: MIT
  license_file: COPYING
  dev_url: https://gitlab.freedesktop.org/xorg/xserver
  doc_url: https://www.x.org/wiki/Documentation/

extra:
  recipe-maintainers:
    - ViridianMelody
  skip-lints:
    - python_build_tools_in_host
